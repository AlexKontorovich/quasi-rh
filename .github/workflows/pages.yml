name: Publish blueprint to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'blueprint/index.html'
      - 'ElevenTwelfths/**'
      - 'scripts/sync-blueprint.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Check Lean excerpts against source
        run: node scripts/sync-blueprint.mjs --check
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare standalone blueprint
        run: |
          mkdir -p _site
          cp blueprint/index.html _site/index.html
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
