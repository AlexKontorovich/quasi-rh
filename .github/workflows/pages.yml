name: Publish blueprint to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'blueprint/**'
      - 'ElevenTwelfths/**'
      - 'OAI/**'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'package*.json'
      - 'scripts/build-blueprint.mjs'
      - 'scripts/sync-blueprint.mjs'
      - 'tests/sync-blueprint.test.mjs'
      - 'tests/verso-blueprint.test.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LEAN_NUM_THREADS: 2
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check Lean excerpts against source
        run: node scripts/sync-blueprint.mjs --check
      - name: Check excerpt declaration boundaries
        run: node tests/sync-blueprint.test.mjs
      - name: Plan Verso source modules
        id: plan
        run: echo "targets=$(node scripts/build-blueprint.mjs --plan | sed 's/$/:literate/' | paste -sd ' ' -) verso-html" >> "$GITHUB_OUTPUT"
      - name: Set up Lean, fetch Mathlib cache, and compile Verso source
        uses: leanprover/lean-action@v1
        with:
          auto-config: 'false'
          build: 'true'
          build-args: ${{ steps.plan.outputs.targets }}
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Render interactive blueprint and linked Lean source
        run: |
          lake exe verso-html .lake/build/literate _site
          node scripts/build-blueprint.mjs --render-only
          node tests/verso-blueprint.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
