name: Publish blueprint to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'blueprint/**'
      - 'ElevenTwelfths/**'
      - 'OAI/**'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'package*.json'
      - 'scripts/build-blueprint.mjs'
      - 'scripts/sync-blueprint.mjs'
      - 'tests/sync-blueprint.test.mjs'
      - 'tests/verso-blueprint.test.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LEAN_NUM_THREADS: 2
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      # CSS is deliberately excluded: overlay current styles on validated HTML.
      # All statement/prose/renderer inputs must match exactly; no fallback key.
      - name: Restore finished site for instant styling updates
        id: finished
        uses: actions/cache/restore@v4
        with:
          path: _site
          key: blueprint-finished-v1-${{ runner.os }}-${{ hashFiles('**/*.lean', 'lake-manifest.json', 'lean-toolchain', 'blueprint/page.html', 'package*.json', 'scripts/*.mjs', 'tests/*.mjs') }}
      - uses: actions/setup-node@v4
        if: steps.finished.outputs.cache-hit != 'true'
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
        if: steps.finished.outputs.cache-hit != 'true'
      - name: Check Lean excerpts against source
        if: steps.finished.outputs.cache-hit != 'true'
        run: node scripts/sync-blueprint.mjs --check
      - name: Check excerpt declaration boundaries
        if: steps.finished.outputs.cache-hit != 'true'
        run: node tests/sync-blueprint.test.mjs
      - name: Plan Verso source modules
        if: steps.finished.outputs.cache-hit != 'true'
        id: plan
        run: |
          node scripts/build-blueprint.mjs --plan > /tmp/blueprint-modules
          echo "targets=$(sed 's/$/:literate/' /tmp/blueprint-modules | paste -sd ' ' -) verso-html" >> "$GITHUB_OUTPUT"
          echo "modules=$(sort /tmp/blueprint-modules | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      # This small cache contains raw semantic HTML and declaration locations,
      # not oleans or the Lean toolchain. Prose/CSS edits need only Node.
      # No fallback key: stale Lean statements must never be published.
      - name: Restore checked Lean presentation data
        if: steps.finished.outputs.cache-hit != 'true'
        id: presentation
        uses: actions/cache/restore@v4
        with:
          path: |
            _site
            .lake/build/lib/lean/**/*.ilean
          key: blueprint-semantic-v1-${{ runner.os }}-${{ hashFiles('**/*.lean', 'lake-manifest.json', 'lean-toolchain') }}-${{ steps.plan.outputs.modules }}
      - name: Set up Lean, fetch Mathlib cache, and compile Verso source
        if: steps.finished.outputs.cache-hit != 'true' && steps.presentation.outputs.cache-hit != 'true'
        uses: leanprover/lean-action@v1
        with:
          auto-config: 'false'
          build: 'true'
          build-args: ${{ steps.plan.outputs.targets }}
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Generate raw Verso source pages
        if: steps.finished.outputs.cache-hit != 'true' && steps.presentation.outputs.cache-hit != 'true'
        run: lake exe verso-html .lake/build/literate _site
      - name: Cache checked Lean presentation data
        if: steps.finished.outputs.cache-hit != 'true' && steps.presentation.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            _site
            .lake/build/lib/lean/**/*.ilean
          key: ${{ steps.presentation.outputs.cache-primary-key }}
      - name: Render interactive blueprint and linked Lean source
        if: steps.finished.outputs.cache-hit != 'true'
        run: |
          node scripts/build-blueprint.mjs --render-only
          node tests/verso-blueprint.test.mjs
      - name: Cache validated finished site
        if: steps.finished.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _site
          key: ${{ steps.finished.outputs.cache-primary-key }}
      - name: Apply current styles without rebuilding
        run: |
          cp blueprint/theme.css _site/blueprint-theme.css
          cp blueprint/verso.css _site/blueprint-verso.css
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
